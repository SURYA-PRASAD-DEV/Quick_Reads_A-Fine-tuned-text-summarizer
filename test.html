<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Text Summarizer</h1>
        
        <textarea id="inputText" placeholder="Enter text to summarize..."></textarea>
        
        <label for="numLines">Number of Sentences:</label>
        <input type="number" id="numLines" min="1" value="3">
        
        <label for="language">Select Language:</label>
        <select id="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="hi">Hindi</option>
            <option value="zh-cn">Chinese</option>
        </select>

        <button onclick="summarizeText()">Summarize</button>

        <h2>Summary:</h2>
        <p id="summaryText"></p>

        <button id="playAudio" style="display:none;" onclick="playAudio()">🔊 Listen</button>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
